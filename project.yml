name: SaveTheDate
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    DEVELOPMENT_TEAM: UKUPW4MBU8
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
targets:
  SaveTheDate:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iflora.savethedate
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Save the Date
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSContactsUsageDescription: Save the Date reads birthdays and anniversaries from your contacts so you can add them with one tap. Nothing is changed or uploaded.
    scheme:
      testTargets: [SaveTheDateTests]
  SaveTheDateTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: SaveTheDate
