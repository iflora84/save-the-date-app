name: SaveTheDate
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    DEVELOPMENT_TEAM: UKUPW4MBU8
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
targets:
  SaveTheDate:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      # iOS 26 only; weak so the app still launches on iOS 17-25.
      - sdk: FoundationModels.framework
        weak: true
    settings:
      base:
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "FoundationModels"]
        PRODUCT_BUNDLE_IDENTIFIER: com.iflora.savethedate
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Save the Date
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: Save the Date looks through your calendar for birthdays, anniversaries and trips so you can add them in one go. Your calendar is read on this iPhone only and never changed or uploaded.
        NSContactsUsageDescription: Save the Date reads birthdays and anniversaries from your contacts so you can add them with one tap. Nothing is changed or uploaded.
    scheme:
      testTargets: [SaveTheDateTests]
  SaveTheDateTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: SaveTheDate
