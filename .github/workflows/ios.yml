# Generates the Xcode project with XcodeGen, runs the unit tests on a
# simulator, archives unsigned, then signs with Xcode cloud signing through
# the App Store Connect API key and uploads to TestFlight.
#
# The public repo (iflora84/save-the-date-app) only tests and archives; it holds
# no secrets. Uploads run on the private repo (iflora84/save-the-date), whose
# run numbers continue the build numbers already on App Store Connect.
# Secrets there: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (contents of the .p8).
name: iOS

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  TEAM_ID: UKUPW4MBU8
  SCHEME: SaveTheDate

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen

      - name: Generate project
        run: |
          sed -i '' "s|CURRENT_PROJECT_VERSION: \"1\"|CURRENT_PROJECT_VERSION: \"${GITHUB_RUN_NUMBER}\"|" project.yml
          grep -n CURRENT_PROJECT_VERSION project.yml
          xcodegen generate
          test -d "${SCHEME}.xcodeproj"

      - name: Unit tests
        run: |
          set -o pipefail
          sim=$(xcrun simctl list devices available iPhone | grep -oE 'iPhone [^(]+' | head -1 | xargs)
          echo "simulator: $sim"
          xcodebuild test -project "${SCHEME}.xcodeproj" -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$sim" \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E "error:|Test Case|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log

      - name: Archive (unsigned)
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project "${SCHEME}.xcodeproj" -scheme "$SCHEME" \
            -sdk iphoneos -configuration Release -destination "generic/platform=iOS" \
            archive -archivePath "build/${SCHEME}.xcarchive" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build/archive.log | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" build/archive.log

      # FoundationModels exists only on iOS 26. A strong link would crash the app at
      # launch on iOS 17-25, which no iOS 26 simulator or test phone would show.
      - name: FoundationModels is weakly linked
        if: github.event_name != 'pull_request'
        run: |
          bin="build/${SCHEME}.xcarchive/Products/Applications/${SCHEME}.app/${SCHEME}"
          otool -l "$bin" | awk '/cmd LC_/{cmd=$2} /name .*FoundationModels/{print cmd}' | tee linkage.txt
          grep -qx LC_LOAD_WEAK_DYLIB linkage.txt
          ! grep -qx LC_LOAD_DYLIB linkage.txt

      # The share extension must be embedded, and Apple rejects a bundle whose
      # privacy manifest is missing (ITMS-91053), so check both before upload.
      - name: Share extension and privacy manifests are in the app
        if: github.event_name != 'pull_request'
        run: |
          app="build/${SCHEME}.xcarchive/Products/Applications/${SCHEME}.app"
          test -d "$app/PlugIns/SaveTheDateShare.appex"
          test -f "$app/PrivacyInfo.xcprivacy"
          test -f "$app/PlugIns/SaveTheDateShare.appex/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$app/PlugIns/SaveTheDateShare.appex/Info.plist"

      - name: App Store Connect API key
        if: github.event_name != 'pull_request' && github.repository == 'iflora84/save-the-date'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Upload to TestFlight
        if: github.event_name != 'pull_request' && github.repository == 'iflora84/save-the-date'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > build/export_options.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath "build/${SCHEME}.xcarchive" \
            -exportOptionsPlist build/export_options.plist -exportPath build/out \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee build/export.log | grep -E "error:|Upload|\*\* EXPORT" || true
          grep -q "\*\* EXPORT SUCCEEDED \*\*" build/export.log

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: |
            test.log
            build/*.log
          if-no-files-found: ignore
